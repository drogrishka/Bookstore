<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bookstore search client</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 3rem auto; padding: 0 1rem; }
    .row { display:flex; gap:.75rem; flex-wrap:wrap; margin:.75rem 0; }
    input { padding:.65rem; min-width:220px; }
    button { padding:.65rem 1rem; cursor:pointer; }
    pre { background:#0f172a; color:#e2e8f0; padding:1rem; border-radius:8px; overflow:auto; min-height:140px; }
    .muted { color:#64748b; }
  </style>
</head>
<body>
<h1>Bookstore search client</h1>
<p>This page tests the required OAuth 2.0 <strong>implicit flow</strong> and the protected search endpoint.</p>
<p class="muted">Demo login: demo@bookstore.local / Demo123!</p>

<div class="row">
  <button id="login">Sign in / get search token</button>
  <button id="clear">Clear token</button>
</div>

<div class="row">
  <input id="title" placeholder="Title contains...">
  <input id="author" placeholder="Author contains...">
  <input id="page" type="number" min="1" value="1" style="min-width:90px">
  <input id="pageSize" type="number" min="1" max="100" value="20" style="min-width:90px">
  <button id="search">Search</button>
</div>

<p id="status"></p>
<pre id="output">No request yet.</pre>

<script>
const tokenKey = "bookstore_search_access_token";
const stateKey = "bookstore_oauth_state";
const output = document.getElementById("output");
const status = document.getElementById("status");

function updateStatus() {
  status.textContent = sessionStorage.getItem(tokenKey)
    ? "Search token is present in sessionStorage."
    : "No search token. Sign in first.";
}
updateStatus();

document.getElementById("login").addEventListener("click", () => {
  const state = crypto.randomUUID();
  sessionStorage.setItem(stateKey, state);
  const redirectUri = `${location.origin}/test-client/callback.html`;
  const url = new URL(`${location.origin}/connect/authorize`);
  url.searchParams.set("client_id", "bookstore-browser");
  url.searchParams.set("response_type", "token");
  url.searchParams.set("redirect_uri", redirectUri);
  url.searchParams.set("scope", "books.search");
  url.searchParams.set("state", state);
  location.assign(url.toString());
});

document.getElementById("clear").addEventListener("click", () => {
  sessionStorage.removeItem(tokenKey);
  updateStatus();
});

document.getElementById("search").addEventListener("click", async () => {
  const token = sessionStorage.getItem(tokenKey);
  if (!token) {
    output.textContent = "No token. Use 'Sign in / get search token' first.";
    return;
  }

  const url = new URL(`${location.origin}/api/books/search`);
  const title = document.getElementById("title").value.trim();
  const author = document.getElementById("author").value.trim();
  if (title) url.searchParams.set("title", title);
  if (author) url.searchParams.set("author", author);
  url.searchParams.set("page", document.getElementById("page").value || "1");
  url.searchParams.set("pageSize", document.getElementById("pageSize").value || "20");

  const response = await fetch(url, {
    headers: { "Authorization": `Bearer ${token}` }
  });

  const text = await response.text();
  output.textContent = `HTTP ${response.status}\n\n${text}`;
});
</script>
</body>
</html>
